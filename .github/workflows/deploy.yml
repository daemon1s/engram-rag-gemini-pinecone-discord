name: Deploy

# Deploy simple al VPS Oracle (ARM64): el build se hace en el VPS.
# Si el healthcheck falla, vuelve al commit anterior automaticamente.
# Por ahora solo manual. Para deploy en cada push, agregar:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-engram
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /home/ubuntu/apps/engram-rag-gemini-pinecone-discord
  COMPOSE_FILE: docker-compose.deploy.yml
  HEALTH_URLS: "http://127.0.0.1:3001/"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy con rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR,COMPOSE_FILE,HEALTH_URLS
          script: |
            set -u
            cd "$APP_DIR"

            healthy() {
              for i in $(seq 1 60); do
                ok=1
                for u in $HEALTH_URLS; do curl -fs -o /dev/null "$u" || ok=0; done
                [ "$ok" = 1 ] && return 0
                sleep 2
              done
              return 1
            }

            prev=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            echo "deploy: $prev -> $(git rev-parse HEAD)"

            if docker compose -f "$COMPOSE_FILE" up -d --build && healthy; then
              docker image prune -f
              echo "OK"
              exit 0
            fi

            echo "FALLO. Rollback a $prev"
            git reset --hard "$prev"
            docker compose -f "$COMPOSE_FILE" up -d --build
            healthy && echo "rollback OK" || echo "rollback tambien fallo, revisar a mano"
            exit 1

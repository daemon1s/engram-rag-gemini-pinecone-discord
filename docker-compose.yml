services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: db_engram
      POSTGRES_USER: engram_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  engram_bot:
    image: daemon1s/engram-bot:latest
    build: .
    env_file: .env
    depends_on:
      - postgres
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; exit(0 if os.path.exists('/tmp/bot_ready') else 1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: daemon1s/engram-dashboard:latest
    build: ./dashboard
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      - postgres
    restart: always
    networks:
      - default
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  postgres_data:
